    set: novel
    derived_from: S3
    hash: sha256:a90ffc574d95a75e9642bc3fdb69eb428521b93a12b973e1d1e6e57317e3dffc
    truth: {action: escalate, kind: investigate, fault_class: image_pull}

  # Memory limit too low: both containers OOMKilled, one in CrashLoopBackOff. No fault class fits
  # (no OOM class, no runbook), so the truth is escalate with unknown; the limit lives in Git.
  # Closest other reading: escalate / investigate / unknown, or abstain.
  - scenario: N2
