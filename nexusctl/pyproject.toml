[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nexusctl"
version = "0.1.0"
description = "The human interface to NEXUS: inspect incidents, approve or reject proposals (spec §16A)"
requires-python = ">=3.12"
dependencies = ["nexus-client", "typer>=0.27,<1", "rich>=15,<16", "pyyaml>=6,<7"]

[project.scripts]
nexusctl = "nexusctl.app:main"
kubectl-nexus = "nexusctl.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["yaml", "kubernetes", "kubernetes.*"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["nexusctl"]
known-third-party = ["nexus_client"]
