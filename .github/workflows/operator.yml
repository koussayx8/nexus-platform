name: NEXUS Operator

# The operator's pipeline (spec §19; M1b-8, ADR-025): lint, unit tests, image build and Trivy
# scan on every pull request that touches it; push and Cosign keyless signing on main only, as
# ci.yml does for sample-api. Images are multi-arch (linux/amd64 + linux/arm64, ADR-030): the pull
# request job runs the amd64 image through Trivy and builds arm64 without pushing; main pushes one
# index and Cosign signs its digest. The envtest integration test (operator/tests/envtest/) is run by
# hand, never here; the unit tests check P6 as an order of events (owner, M1b-8 point 3).
on:
  push:
    branches: [main]
    paths:
      - 'operator/**'
      - '.github/workflows/operator.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'operator/**'
      - '.github/workflows/operator.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/nexus-operator

permissions:
  contents: read

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.diff.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only "$PR_BASE...$PR_HEAD" -- operator .github/workflows/operator.yml ':(exclude)operator/k8s')
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            files=new-branch
          else
            files=$(git diff --name-only "$BEFORE" "$SHA" -- operator .github/workflows/operator.yml ':(exclude)operator/k8s')
          fi
          echo "files that need an image:"; echo "${files:-<none>}"
          if [ -n "$files" ]; then echo "image=true" >> "$GITHUB_OUTPUT"; else echo "image=false" >> "$GITHUB_OUTPUT"; fi

  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install -r operator/requirements-dev.txt
      - run: ruff check operator/
      - run: ruff format --check operator/

  test:
    name: Test (Pytest, offline)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          # The hashed runtime set exactly as the image gets it, then the unhashed dev tools.
          pip install --only-binary=:all: --require-hashes -r operator/requirements.txt
          pip install -r operator/requirements-dev.txt
      - name: Run unit tests
        env:
          KUBECONFIG: /nonexistent
        run: |
          cd operator
          pytest -v

  build:
    name: Build, Scan & Push
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: needs.changes.outputs.image == 'true'
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU (arm64 builds on the amd64 runner)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build (pull request, not pushed)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: operator
          load: true
          push: false
          tags: nexus-operator:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha,scope=nexus-operator-amd64
          cache-to: type=gha,scope=nexus-operator-amd64,mode=max

      - name: Check the image resolves UID 10001 (passwd entry)
        if: github.event_name == 'pull_request'
        run: |
          # Kopf's getpass.getuser() reads USER and LOGNAME first; docker run sets neither, so
          # this reaches pwd.getpwuid(10001), the call that raised KeyError at the #100 live gate.
          name=$(docker run --rm --user 10001:10001 --entrypoint python \
            "nexus-operator:pr-${{ github.event.pull_request.number }}" -c 'import getpass; print(getpass.getuser())')
          test "$name" = nexus-operator

      - name: Trivy scan (pull request image)
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nexus-operator:pr-${{ github.event.pull_request.number }}
          format: table
          severity: 'CRITICAL,HIGH'

      - name: Build linux/arm64 (pull request, not pushed, not loaded)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: operator
          platforms: linux/arm64
          push: false
          provenance: false
          cache-from: type=gha,scope=nexus-operator-arm64
          cache-to: type=gha,scope=nexus-operator-arm64,mode=max

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch

      - name: Build and push (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: operator
          platforms: linux/amd64,linux/arm64
          push: true
          # No provenance/SBOM attestation manifests: the index holds only the two platform images,
          # and the Cosign signature on its digest is the provenance (spec §19).
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=nexus-operator-multi
          cache-to: type=gha,scope=nexus-operator-multi,mode=max

      - name: Trivy scan (pushed image, by digest, linux/amd64)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: 'sarif'
          output: 'trivy-amd64.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Trivy scan (pushed image, by digest, linux/arm64)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: 'sarif'
          output: 'trivy-arm64.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy SARIF (amd64)
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          sarif_file: trivy-amd64.sarif
          category: trivy-nexus-operator-amd64
        continue-on-error: true

      - name: Upload Trivy SARIF (arm64)
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          sarif_file: trivy-arm64.sarif
          category: trivy-nexus-operator-arm64
        continue-on-error: true

  sign:
    name: Sign Image (Cosign)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      packages: write
      id-token: write
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: 'v2.5.2'   # explicit, not the installer's default (TASKS.md M2-2)

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign image
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}

  digest-bump:
    name: Digest bump (pull request to dev)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, sign]
    # Spec §19: a digest bump is a commit. CI holds no cluster credential; the bump reaches the
    # cluster only when this pull request is merged. Needs the repository setting "Allow GitHub
    # Actions to create and approve pull requests". A pull request opened with GITHUB_TOKEN does not
    # start workflows, so the required check would never run: set the DIGEST_BUMP_TOKEN secret
    # (fine-grained PAT, contents and pull-requests write) for that.
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.DIGEST_BUMP_TOKEN || secrets.GITHUB_TOKEN }}
      DIGEST: ${{ needs.build.outputs.digest }}
      IMAGE: ghcr.io/${{ github.repository }}/nexus-operator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          token: ${{ secrets.DIGEST_BUMP_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: 'v2.5.2'

      - name: Verify the signature before writing the digest
        run: |
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/operator.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: Open the bump pull request
        run: |
          set -euo pipefail
          branch="bot/bump-nexus-operator-${DIGEST:7:12}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "$branch already exists; nothing to do"; exit 0
          fi
          bash .github/scripts/bump-digest.sh nexus-operator "$DIGEST"
          if git diff --quiet; then echo "dev already pins $DIGEST"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -a -m "chore(nexus-operator): bump the image digest to ${DIGEST:0:19}" \
            -m "Signed image from ${{ github.workflow }} run ${{ github.run_id }} at ${{ github.sha }}, cosign-verified in this job."
          git push origin "$branch"
          gh pr create --base dev --head "$branch" \
            --title "chore(nexus-operator): bump the image digest to ${DIGEST:0:19}" \
            --body "Digest \`$DIGEST\` from ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} (commit ${{ github.sha }}), signature verified with cosign v2.5.2 against operator.yml@refs/heads/main. Review the diff, and update the comment above the pin by hand if it names the previous run."
