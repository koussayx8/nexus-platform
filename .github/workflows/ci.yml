name: NEXUS CI Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'apps/sample-api/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'apps/sample-api/**'
      - '.github/workflows/ci.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/sample-api

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install -r apps/sample-api/requirements-dev.txt
      - run: ruff check apps/sample-api/
      - run: ruff format --check apps/sample-api/

  test:
    name: Test (Pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          cd apps/sample-api
          # Two installs: the hashed runtime set exactly as the image gets it, then the
          # unhashed dev tools (one pip call would demand hashes for both files).
          pip install --require-hashes -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run tests
        run: |
          cd apps/sample-api
          pytest test_main.py -v

  security-sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    needs: lint
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Semgrep
        run: semgrep scan --config=auto --sarif --output=semgrep.sarif apps/sample-api/ || true
      - uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        if: always()
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

  security-secrets:
    name: Secret Scan (GitLeaks)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-check:
    name: Build check (pull request, amd64 + arm64)
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU (arm64 builds on the amd64 runner)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build linux/amd64 (not pushed)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: apps/sample-api
          load: true
          push: false
          tags: sample-api:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha,scope=sample-api-amd64
          cache-to: type=gha,scope=sample-api-amd64,mode=max

      - name: Trivy scan (pull request image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sample-api:pr-${{ github.event.pull_request.number }}
          format: table
          severity: 'CRITICAL,HIGH'

      - name: Build linux/arm64 (not pushed, not loaded)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: apps/sample-api
          platforms: linux/arm64
          push: false
          provenance: false
          cache-from: type=gha,scope=sample-api-arm64
          cache-to: type=gha,scope=sample-api-arm64,mode=max

  build-and-push:
    name: Build, Scan & Push
    runs-on: ubuntu-latest
    needs: [test, security-sast, security-secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU (arm64 builds on the amd64 runner)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: apps/sample-api
          platforms: linux/amd64,linux/arm64
          push: true
          # No provenance/SBOM attestation manifests: the index holds only the two platform images,
          # and the Cosign signature on its digest is the provenance (spec §19).
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=sample-api-multi
          cache-to: type=gha,scope=sample-api-multi,mode=max

      - name: Trivy scan (pushed image, by digest, linux/amd64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: 'sarif'
          output: 'trivy-amd64.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Trivy scan (pushed image, by digest, linux/arm64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: 'sarif'
          output: 'trivy-arm64.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy SARIF (amd64)
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        if: always()
        with:
          sarif_file: trivy-amd64.sarif
          category: trivy-sample-api-amd64
        continue-on-error: true

      - name: Upload Trivy SARIF (arm64)
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        if: always()
        with:
          sarif_file: trivy-arm64.sarif
          category: trivy-sample-api-arm64
        continue-on-error: true

  sign:
    name: Sign Image (Cosign)
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: 'v2.5.2'   # explicit, not the installer's default (TASKS.md M2-2)

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign image
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.digest }}

  digest-bump:
    name: Digest bump (pull request to dev)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-and-push, sign]
    # Spec §19: a digest bump is a commit. CI holds no cluster credential; the bump reaches the
    # cluster only when this pull request is merged. Needs the repository setting "Allow GitHub
    # Actions to create and approve pull requests". A pull request opened with GITHUB_TOKEN does not
    # start workflows, so the required check would never run: set the DIGEST_BUMP_TOKEN secret
    # (fine-grained PAT, contents and pull-requests write) for that.
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.DIGEST_BUMP_TOKEN || secrets.GITHUB_TOKEN }}
      DIGEST: ${{ needs.build-and-push.outputs.digest }}
      IMAGE: ghcr.io/${{ github.repository }}/sample-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          token: ${{ secrets.DIGEST_BUMP_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: 'v2.5.2'

      - name: Verify the signature before writing the digest
        run: |
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: Open the bump pull request
        run: |
          set -euo pipefail
          branch="bot/bump-sample-api-${DIGEST:7:12}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "$branch already exists; nothing to do"; exit 0
          fi
          bash .github/scripts/bump-digest.sh sample-api "$DIGEST"
          if git diff --quiet; then echo "dev already pins $DIGEST"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -a -m "chore(sample-api): bump the image digest to ${DIGEST:0:19}" \
            -m "Signed image from ${{ github.workflow }} run ${{ github.run_id }} at ${{ github.sha }}, cosign-verified in this job."
          git push origin "$branch"
          gh pr create --base dev --head "$branch" \
            --title "chore(sample-api): bump the image digest to ${DIGEST:0:19}" \
            --body "Digest \`$DIGEST\` from ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} (commit ${{ github.sha }}), signature verified with cosign v2.5.2 against ci.yml@refs/heads/main. Review the diff, and update the comment above the pin by hand if it names the previous run."
