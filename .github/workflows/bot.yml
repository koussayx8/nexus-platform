name: NEXUS Bot

# The Telegram bot's pipeline (ADR-040 step 1; spec §19), as operator.yml: lint, strict mypy and
# offline tests, then the multi-arch image (linux/amd64 + linux/arm64). Pull requests prove both
# platforms build, check the image's user and entrypoint, and Trivy-scan it; nothing is pushed. On
# main the image is pushed, scanned by digest, signed with Cosign keyless, and a digest-bump pull
# request into dev is opened for bot/k8s/deployment.yaml, which no Argo CD Application references
# yet: merged is not deployed.
# The image carries nexus-client, nexusctl's renderer and C8's nexus_revert (see bot/Dockerfile), so
# the push paths include them; the bot's README and tests build no image, so a docs or test change
# on main does not rebuild and bump. Pull requests also run on the bot's manifests, RBAC,
# NetworkPolicies and the Alertmanager values, which the tests check. Every action is pinned by
# commit SHA.
on:
  push:
    branches: [main]
    paths:
      - 'bot/**'
      - '!bot/k8s/**'   # deploy manifests build no image; without this a merged digest bump would rebuild and bump again
      - '!bot/README.md'
      - '!bot/tests/**'
      - 'libs/nexus-client/src/**'
      - 'libs/nexus-revert/nexus_revert/**'
      - 'nexusctl/src/nexusctl/__init__.py'
      - 'nexusctl/src/nexusctl/render/**'
      - '.github/workflows/bot.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'bot/**'
      - 'libs/nexus-client/**'
      - 'libs/nexus-revert/**'
      - 'nexusctl/**'
      - 'platform/rbac/nexus-bot/**'
      - 'platform/network/nexus-bot/**'
      - 'platform/observability/**'
      - 'platform/argocd/**'
      - '.github/workflows/bot.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/nexus-bot
  COSIGN_RELEASE: v2.5.2   # as operator.yml

permissions:
  contents: read

concurrency:
  group: bot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, type-check and test (offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install (the runner's Python 3.12)
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          # The hashed runtime set exactly as the image gets it, then the unhashed dev tools.
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --only-binary=:all: --require-hashes -r bot/requirements.txt
          "$RUNNER_TEMP/venv/bin/pip" install --quiet -r nexusctl/requirements-dev.txt -e libs/nexus-client -e nexusctl -e libs/nexus-revert -e bot
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: ruff
        run: ruff check bot

      - name: mypy (strict)
        run: (cd bot && mypy nexus_bot tests)

      - name: pytest
        env:
          KUBECONFIG: /nonexistent
        run: (cd bot && pytest -q)

  build:
    name: Build, Scan & Push
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU (linux/arm64 builds)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Pull request: prove both platforms build, and check and scan the amd64 image. Nothing is pushed.
      - name: Build linux/amd64 (pull request, loaded for the checks)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: bot/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: nexus-bot:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build linux/amd64 + linux/arm64 (pull request, not pushed)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: bot/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha

      - name: Check the image's user, imports and fail-closed start
        if: github.event_name == 'pull_request'
        env:
          IMAGE: nexus-bot:pr-${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          user=$(docker run --rm --entrypoint python "$IMAGE" -c 'import os, pwd; print(pwd.getpwuid(os.getuid()).pw_name)')
          test "$user" = nexus-bot
          # the renderer comes from nexusctl's source; typer and rich are not in the image
          docker run --rm --entrypoint python "$IMAGE" -c 'import sys, nexus_bot.main, nexus_bot.kube, nexusctl.render.views, nexus_revert.service; assert "typer" not in sys.modules and "rich" not in sys.modules'
          # C8 runs the system git (ADR-041), as the non-root user
          docker run --rm --read-only --network none --entrypoint git "$IMAGE" --version
          # no config and no token: the entrypoint exits 2 without making any call
          set +e
          docker run --rm --read-only --network none "$IMAGE"
          rc=$?
          set -e
          test "$rc" = 2

      - name: Trivy scan (pull request image)
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nexus-bot:pr-${{ github.event.pull_request.number }}
          format: table
          severity: 'CRITICAL,HIGH'

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch

      - name: Build and push (main, linux/amd64 + linux/arm64)
        if: github.event_name == 'push'
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: bot/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The pushed index digest (spec §19). SARIF is the amd64 image; arm64 is logged.
      - name: Trivy scan (pushed digest, linux/amd64, SARIF)
        if: github.event_name == 'push'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
        env:
          TRIVY_PLATFORM: linux/amd64

      - name: Upload Trivy SARIF
        if: always() && github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

      - name: Trivy scan (pushed digest, linux/arm64, table)
        if: github.event_name == 'push'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: table
          severity: 'CRITICAL,HIGH'
        env:
          TRIVY_PLATFORM: linux/arm64

  sign:
    name: Sign Image (Cosign)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    permissions:
      packages: write
      id-token: write
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: ${{ env.COSIGN_RELEASE }}

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Signs the index digest, which the manifest pins; both platform manifests hang under it.
      - name: Sign image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"

      - name: Verify the signature just made
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}
          IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          cosign verify \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE" > /dev/null

  # Opens a pull request into dev that bumps bot/k8s/deployment.yaml to the signed digest, as
  # operator.yml does; it needs the DIGEST_BUMP_TOKEN secret and skips with a notice without it.
  digest-bump:
    name: Digest-bump pull request
    runs-on: ubuntu-latest
    needs: [build, sign]
    if: github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.DIGEST_BUMP_TOKEN }}
      HAS_TOKEN: ${{ secrets.DIGEST_BUMP_TOKEN != '' }}
    steps:
      - name: Skip when DIGEST_BUMP_TOKEN is absent
        if: env.HAS_TOKEN != 'true'
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          echo "::notice title=Digest-bump pull request skipped::The DIGEST_BUMP_TOKEN secret is not set, so no pull request was opened (a GITHUB_TOKEN pull request would never run the required repo-checks). Bump by hand to ${DIGEST}."
          echo "Digest bump skipped: DIGEST_BUMP_TOKEN is not set. Signed digest: \`${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_TOKEN == 'true'
        with:
          ref: dev
          token: ${{ env.GH_TOKEN }}

      - name: Bump the bot manifest and open the pull request
        if: env.HAS_TOKEN == 'true'
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          branch="digest-bump/nexus-bot-${SOURCE_SHA:0:12}"
          python3 .github/scripts/bump_digest.py bot/k8s/deployment.yaml "$IMAGE" "$DIGEST"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add bot/k8s/deployment.yaml
          git commit -m "chore(bot): bump nexus-bot to ${DIGEST:0:19}" \
            -m "Built from ${SOURCE_SHA} by bot.yml, Trivy-scanned and Cosign-signed by digest (signature verified in the sign job)."
          git push origin "$branch"
          gh pr create --base dev --head "$branch" \
            --title "chore(bot): bump nexus-bot to ${DIGEST:0:19}" \
            --body "Digest bump for \`${IMAGE}\` from ${SOURCE_SHA}. Verify with \`cosign verify\` before merging. bot/k8s is not wired into any Application yet."
