name: repo-checks

# The required check on main and dev (ADR-012). Deliberately not path-filtered:
# a required check must run on every pull request, or pull requests wait forever.
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: repo-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  KUBECONFORM_VERSION: 0.8.0
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
  KUSTOMIZE_VERSION: 5.8.1
  KUSTOMIZE_SHA256: 029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d
  HELM_VERSION: 3.20.2          # Helm 3, as used by ArgoCD 3.3 to render charts
  HELM_SHA256: 258e830a9e613c8a7a302d6059b4bb3b9758f2f3e1bb8ea0d707ce10a9a72fea
  YQ_VERSION: 4.53.6
  YQ_SHA256: c5f056448f973ae7d39b5401949648a78f2dc1947d6a8eb65be60d5c504b9385
  PROMETHEUS_VERSION: 3.12.0    # promtool from the Prometheus that chart 86.2.2 runs (ADR-024)
  PROMETHEUS_SHA256: 20da47f8e5303f74aecb78edd7f7e39041dac08ac4939dba75efd7a900ae8867
  SHELLCHECK_VERSION: 0.11.0    # sha256 of the linux.x86_64 release asset as downloaded 2026-11-02 (upstream publishes none)
  SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198

jobs:
  repo-checks:
    name: repo-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned tools (checksum verified)
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"; cd "$RUNNER_TEMP"
          fetch() {  # fetch <url> <sha256>
            curl -fsSL -o pkg.tgz "$1"
            echo "$2  pkg.tgz" | sha256sum -c -
            tar -xzf pkg.tgz -C "$bin"
            rm -f pkg.tgz
          }
          fetch "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "$GITLEAKS_SHA256"
          fetch "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" "$KUBECONFORM_SHA256"
          fetch "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" "$KUSTOMIZE_SHA256"
          curl -fsSL -o pkg.tgz "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          echo "$HELM_SHA256  pkg.tgz" | sha256sum -c -
          tar -xzf pkg.tgz -C "$bin" --strip-components=1 linux-amd64/helm
          rm -f pkg.tgz
          curl -fsSL -o "$bin/yq" "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64"
          echo "$YQ_SHA256  $bin/yq" | sha256sum -c -
          chmod +x "$bin/yq"
          curl -fsSL -o pkg.tgz "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          echo "$PROMETHEUS_SHA256  pkg.tgz" | sha256sum -c -
          tar -xzf pkg.tgz -C "$bin" --strip-components=1 "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          rm -f pkg.tgz
          curl -fsSL -o pkg.txz "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "$SHELLCHECK_SHA256  pkg.txz" | sha256sum -c -
          tar -xJf pkg.txz -C "$bin" --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          rm -f pkg.txz
          echo "$bin" >> "$GITHUB_PATH"

      - name: Locust, for the class-dispatch test (experiments/calibration)
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/locust-venv"
          "$RUNNER_TEMP/locust-venv/bin/pip" install --quiet locust==2.46.7
          echo "NEXUS_LOCUST_PYTHON=$RUNNER_TEMP/locust-venv/bin/python" >> "$GITHUB_ENV"

      - name: Commit range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ] \
            || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # New branch, or a force push whose old head is gone from this clone (`git log` on it
            # would fail): scan everything the head adds on top of main (ADR-012).
            base=$(git merge-base origin/main "$SHA")
            range="$base..$SHA"
          else
            range="$BEFORE..$SHA"
          fi
          echo "range=$range" >> "$GITHUB_OUTPUT"

      - name: GitLeaks, kustomize build, render Applications, kubeconform
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: bash .github/scripts/repo-checks.sh "$RANGE"
