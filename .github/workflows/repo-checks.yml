name: repo-checks

# The required check on main and dev (ADR-012). Deliberately not path-filtered:
# a required check must run on every pull request, or pull requests wait forever.
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: repo-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  KUBECONFORM_VERSION: 0.8.0
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
  KUSTOMIZE_VERSION: 5.8.1
  KUSTOMIZE_SHA256: 029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d

jobs:
  repo-checks:
    name: repo-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned tools (checksum verified)
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"; cd "$RUNNER_TEMP"
          fetch() {  # fetch <url> <sha256>
            curl -fsSL -o pkg.tgz "$1"
            echo "$2  pkg.tgz" | sha256sum -c -
            tar -xzf pkg.tgz -C "$bin"
            rm -f pkg.tgz
          }
          fetch "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "$GITLEAKS_SHA256"
          fetch "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" "$KUBECONFORM_SHA256"
          fetch "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" "$KUSTOMIZE_SHA256"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Commit range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            # New branch: scan everything it adds on top of main (ADR-012).
            base=$(git merge-base origin/main "$SHA")
            range="$base..$SHA"
          else
            range="$BEFORE..$SHA"
          fi
          echo "range=$range" >> "$GITHUB_OUTPUT"

      - name: GitLeaks, kustomize build, kubeconform
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: bash .github/scripts/repo-checks.sh "$RANGE"
