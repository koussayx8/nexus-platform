name: harness

# M4 harness (T4): lint and offline tests for experiments/harness/. The tests import the operator's
# redact/proposal/catalogue/rules modules and scripts/audit-join.py and read the Flight Recorder
# schema, so changes to those paths run this job too. Standard library only: nothing from
# operator/requirements.txt is installed. Path-filtered; repo-checks (not path-filtered) still runs.
on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'experiments/harness/**'
      - 'operator/nexus_operator/redact.py'
      - 'operator/nexus_operator/proposal.py'
      - 'operator/nexus_operator/catalogue.py'
      - 'operator/nexus_operator/rules.py'
      - 'operator/k8s/flight-recorder-db/05-schema.sql'
      - 'scripts/audit-join.py'
      - '.github/workflows/harness.yml'
  push:
    branches: [main, dev]
    paths:
      - 'experiments/harness/**'
      - 'operator/nexus_operator/redact.py'
      - 'operator/nexus_operator/proposal.py'
      - 'operator/nexus_operator/catalogue.py'
      - 'operator/nexus_operator/rules.py'
      - 'operator/k8s/flight-recorder-db/05-schema.sql'
      - 'scripts/audit-join.py'
      - '.github/workflows/harness.yml'

permissions:
  contents: read

concurrency:
  group: harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: harness
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install ruff==0.16.9
      - run: ruff check experiments/harness
      - run: ruff format --check experiments/harness
      - name: Unit tests (offline, no cluster, no network)
        env:
          KUBECONFIG: /nonexistent
        run: python -m unittest discover -s experiments/harness/tests -t . -v
