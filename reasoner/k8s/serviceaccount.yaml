# The Reasoner identity (spec §11): a ServiceAccount that exists so the pod does not run as
# `default`, with no RoleBinding anywhere and its token never mounted (I1, N6). The Deployment sets
# the same on the pod; either alone is enough, both are tested.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nexus-reasoner
  namespace: nexus-reasoner
  labels:
    app.kubernetes.io/name: nexus-reasoner
    app.kubernetes.io/part-of: nexus-platform
automountServiceAccountToken: false
