# Reasoner configuration (spec §16): model ids, endpoints, effort and the score floor live here, never
# in code. API keys are NOT here: `apiKeyEnv` names an environment variable that the Secret
# `nexus-reasoner-keys` provides; the owner creates that Secret (never in Git). The arms are the
# spec's R2 and R3 only: the Haiku arm (H1) was cut on 2026-11-12 (TASKS.md D3, D10).
#
# R2 and R3 are served by the named configs `active` points at (owner, 2026-11-20; ADR-035 addenda B
# and D, ADR-045). NVIDIA NIM only, one backup per arm (owner, after bake-off round 3):
#   r2-primary  nvidia/nemotron-3-ultra-550b-a55b
#   r2-backup   nvidia/nemotron-3.5-super-vl-120b-a12b, a PREVIEW model on NIM
#   r3-primary  google/gemma-4-31b-it, with thinking turned on (extraBody; off by default on NIM)
#   r3-backup   moonshotai/kimi-k3.1-pro
# R3's pair is PROVISIONAL until bake-off round 4. `active` still names r2-groq and r3-groq (Groq's
# gpt-oss-20b and gpt-oss-120b, which ran the Block 3 and Block 5 trials); after round 4 one commit
# switches `active` to the NIM configs and removes the two Groq entries. Switching is that line plus
# a Reasoner restart (the ConfigMap is not generated, so nothing rolls by itself), and
# experiments/harness/arms.py names the config the arm expects: a run served by another config is
# refused by the arm check. The operator's reasonerTimeoutSeconds must match the active R3 entry
# (300 s for both R3 configs), so Diagnosing ends at 330 s.
#
# scoreFloor 3.1739 is the value PROPOSED by experiments/retrieval/results.json (2.9584 in PR #147;
# 3.0675 after rb-gray-failure v2, ADR-039; 3.1739 after the Block 3 polish of rb-gray-failure v3 and
# rb-bad-rollout v2, TASKS.md D23); it is frozen only at G16. The Ollama demo fallback
# has no baseUrl here: the host IP changes on WSL2 and is set at bootstrap (spec §18), so `demo`
# is unavailable (503) until then.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nexus-reasoner-config
  namespace: nexus-reasoner
  labels:
    app.kubernetes.io/name: nexus-reasoner
    app.kubernetes.io/part-of: nexus-platform
data:
  reasoner.json: |
    {
      "indexPath": "/app/index/index.json",
      "scoreFloor": 3.1739,
      "timeoutSeconds": 30,
      "maxOutputTokens": 1024,
      "seed": 0,
      "port": 8080,
      "models": {
        "r2-groq": {"provider": "groq", "model": "openai/gpt-oss-20b", "baseUrl": "https://api.groq.com/openai/v1", "apiKeyEnv": "GROQ_API_KEY", "reasoningEffort": "low"},
        "r2-primary": {"provider": "nvidia", "model": "nvidia/nemotron-3-ultra-550b-a55b", "baseUrl": "https://integrate.api.nvidia.com/v1", "apiKeyEnv": "NVIDIA_API_KEY", "timeoutSeconds": 120, "maxOutputTokens": 8192},
        "r2-backup": {"provider": "nvidia", "model": "nvidia/nemotron-3.5-super-vl-120b-a12b", "baseUrl": "https://integrate.api.nvidia.com/v1", "apiKeyEnv": "NVIDIA_API_KEY", "timeoutSeconds": 120, "maxOutputTokens": 8192},
        "r3-groq": {"provider": "groq", "model": "openai/gpt-oss-120b", "baseUrl": "https://api.groq.com/openai/v1", "apiKeyEnv": "GROQ_API_KEY", "reasoningEffort": "low"},
        "r3-primary": {"provider": "nvidia", "model": "google/gemma-4-31b-it", "baseUrl": "https://integrate.api.nvidia.com/v1", "apiKeyEnv": "NVIDIA_API_KEY", "timeoutSeconds": 300, "maxOutputTokens": 16384, "extraBody": {"chat_template_kwargs": {"enable_thinking": true}}},
        "r3-backup": {"provider": "nvidia", "model": "moonshotai/kimi-k3.1-pro", "baseUrl": "https://integrate.api.nvidia.com/v1", "apiKeyEnv": "NVIDIA_API_KEY", "timeoutSeconds": 300, "maxOutputTokens": 8192},
        "demo": {"provider": "ollama", "model": "llama3.1:8b", "baseUrl": ""}
      },
      "active": {"R2": "r2-groq", "R3": "r3-groq"}
    }
