# The `platform` Application (spec §3): everything cluster-wide that main declares.
# M0: namespaces with their autonomy levels, and the AppProject. M1b: the Incident CRD (spec §8,
# CRD Validation C1-C4), the operator's staged §11 RBAC (M1b-8, ADR-025) and Locust in nexus-load
# (M1b-9, ADR-026). Kyverno policies (K1-K6) and NetworkPolicies join here in later milestones.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespaces
  - argocd/projects/nexus.yaml
  - crds/incidents.nexus.io.yaml
  - rbac
  - load
