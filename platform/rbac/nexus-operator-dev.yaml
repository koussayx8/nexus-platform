# The operator's act-path RBAC, nexus-dev ONLY (M2; spec §11 rows "nexus-dev, nexus-prod only"
# and the cluster reads, staged). nexus-prod stays unbound: its rights come in M3 with Kyverno in
# Enforce, so a mutation there is refused by RBAC before any policy is asked. The two mutating
# rights are exactly deployments/scale (get, patch, update) and pods/eviction (create).
# Still denied by omission (§11): delete anywhere, patch on Incident spec or metadata, writes to
# namespaces, ConfigMaps, Secrets, RBAC or policies, and impersonate, bind, escalate.
# The reads are the ones the Gate, Executor and Verifier use: Deployments and Pods.
# Tested on envtest by operator/tests/envtest/ (RBAC boundary) and by the unit test
# operator/tests/unit/test_rbac_manifest.py, which fails if this file widens.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nexus-operator-act
  namespace: nexus-dev
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments/scale]
    verbs: [get, patch, update]
  - apiGroups: [""]
    resources: [pods/eviction]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nexus-operator-act
  namespace: nexus-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nexus-operator-act
subjects:
  - kind: ServiceAccount
    name: nexus-operator
    namespace: nexus-system
