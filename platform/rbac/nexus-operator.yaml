# The staged §11 RBAC of the nexus-operator ServiceAccount (M1b-8; ADR-023, ADR-025): only the
# spec §11 rows M1b uses. Incidents: create (Alert Poller), status (Incident Reconciler), reads.
# Not granted until M2: the other §11 reads (pods, logs, events, services, endpoints,
# deployments, replicasets, endpointslices, ArgoCD applications), deployments/scale and
# pods/eviction. Never: delete, patch on Incident spec or metadata, writes to namespaces,
# ConfigMaps, Secrets, RBAC or policies (§11 "denied by omission").
# Tested on envtest by operator/tests/envtest/run-envtest.sh; deployed when PR B lists this
# directory in platform/kustomization.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nexus-operator
  namespace: nexus-system
rules:
  - apiGroups: [nexus.io]
    resources: [incidents]
    verbs: [get, list, watch, create]
  - apiGroups: [nexus.io]
    resources: [incidents/status]
    verbs: [get, patch, update]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [nexus-killswitch, nexus-operator-config]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nexus-operator
  namespace: nexus-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nexus-operator
subjects:
  - kind: ServiceAccount
    name: nexus-operator
    namespace: nexus-system
---
# Namespaces are cluster-scoped: the operator reads the nexus.io/autonomy-level label.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nexus-operator-namespaces
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nexus-operator-namespaces
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nexus-operator-namespaces
subjects:
  - kind: ServiceAccount
    name: nexus-operator
    namespace: nexus-system
