# Locust (spec §3 "Locust", §25: Deployment `locust` in nexus-load, managed by `platform`; M1b-9,
# ADR-026). Master and one worker. The locustfile ships as a generated ConfigMap, so a change to it
# rolls both pods.
#
# L2 (this state): the baseline is frozen in master.yaml (--autostart, 24 users = B = 12 req/s per
# namespace). The web API on 8089 is reached only through a port-forward (ADR-026).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nexus-load

labels:
  - pairs:
      app.kubernetes.io/part-of: nexus-platform
      app.kubernetes.io/managed-by: kustomize

resources:
  - master.yaml
  - worker.yaml

configMapGenerator:
  - name: locustfile
    files:
      - locustfile.py
