# loki-stack Helm values for NEXUS dev environment on k3s
# Task 4 of Week 5 observability plan
# Chart version pinned to 2.10.3 — images are pinned by chart maintainers

namespaceOverride: monitoring

# ------------------------------------------------------------------------------
# Loki
# ------------------------------------------------------------------------------
loki:
  enabled: true
  podAnnotations:
    nexus.io/autonomy-level: "0"
  persistence:
    enabled: false
  config:
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2020-10-24
          store: boltdb-shipper
          object_store: filesystem
          schema: v11
          index:
            prefix: index_
            period: 24h
  resources:
    limits:
      memory: 512Mi
      cpu: 300m
    requests:
      memory: 256Mi
      cpu: 150m

# ------------------------------------------------------------------------------
# Promtail
# ------------------------------------------------------------------------------
promtail:
  enabled: true
  podAnnotations:
    nexus.io/autonomy-level: "0"
  config:
    clients:
      - url: http://loki.monitoring:3100/loki/api/v1/push
    # Use the promtail subchart defaults: cri pipeline stage (containerd) and
    # the built-in kubernetes-pods scrape config with the correct __path__
    # (/var/log/pods/*$1/*.log) for k3s. The defaults add namespace/pod/
    # container labels, so Loki can be queried with {namespace="nexus-apps"}.
  resources:
    limits:
      memory: 256Mi
      cpu: 100m
    requests:
      memory: 128Mi
      cpu: 50m

# ------------------------------------------------------------------------------
# Grafana datasource — Loki must NOT be default (Prometheus is already default)
# ------------------------------------------------------------------------------
grafana:
  enabled: false  # Grafana is managed by kube-prometheus-stack, not loki-stack
  sidecar:
    datasources:
      enabled: false
