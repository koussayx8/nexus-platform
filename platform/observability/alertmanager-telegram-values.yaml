# The NEXUS alerts to Telegram (ADR-040 decision 12; D9). Enabled: the `observability` Application
# lists this file after kube-prometheus-stack-values.yaml. Both the bot's token and the chat ID come
# from the Secret monitoring/alertmanager-telegram (keys `token` and `chat_id`), created outside Git
# (bot/README.md step 6) BEFORE this file reaches main: the Prometheus Operator mounts it as a
# required volume, so without it the Alertmanager pod does not start and the operator sees no alerts.
#
# Helm merges maps but replaces lists, so `route` and `receivers` are restated whole: the base
# file's values with one change, the nexus_target route's receiver. bot/tests/test_alertmanager.py
# checks that this file equals the base apart from that change, so the two cannot drift.
# The operator still polls Alertmanager's v2 API; a receiver does not change what it sees.
# Sending with the bot's token does not conflict with the bot's long poll (getUpdates).
alertmanager:
  config:
    route:
      group_by: ['namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'null'
      routes:
        - receiver: 'null'
          matchers:
            - alertname = "Watchdog"
        - receiver: 'nexus-telegram'
          matchers:
            - nexus_target =~ ".+"
          group_by: ['nexus_target']
    receivers:
      - name: 'null'
      - name: 'nexus-telegram'
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/token
            # Alertmanager >= 0.31.0 and Prometheus Operator >= 0.90.0; exclusive with chat_id.
            chat_id_file: /etc/alertmanager/secrets/alertmanager-telegram/chat_id
            # Asks for plain text, but the Prometheus Operator (v0.91.0) drops the empty string when it
            # rewrites the config, so Alertmanager applies its default, HTML, and escapes every label
            # and annotation (ADR-040 "Alertmanager route enabled").
            parse_mode: ''
            disable_notifications: false
            send_resolved: true
  alertmanagerSpec:
    # Mounted at /etc/alertmanager/secrets/<name>/ by the Prometheus Operator.
    secrets:
      - alertmanager-telegram
