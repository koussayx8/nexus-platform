# kube-prometheus-stack Helm values for NEXUS dev environment on k3s
# Task 3 of Week 5 observability plan
# Chart version 86.2.2 pins all images — no :latest tags

namespaceOverride: monitoring

# ------------------------------------------------------------------------------
# k3s-specific: disable control-plane ServiceMonitors (components are embedded)
# ------------------------------------------------------------------------------
kubeEtcd:
  enabled: false

kubeScheduler:
  enabled: false

kubeControllerManager:
  enabled: false

kubeProxy:
  enabled: false

kubeApiServer:
  enabled: false

# Disable coreDns monitoring — creates Service in kube-system which is not in AppProject
coreDns:
  enabled: false

# ------------------------------------------------------------------------------
# Prometheus Operator
# ------------------------------------------------------------------------------
prometheusOperator:
  podAnnotations:
    nexus.io/autonomy-level: "0"
  resources:
    limits:
      memory: 256Mi
      cpu: 200m
    requests:
      memory: 128Mi
      cpu: 100m

# ------------------------------------------------------------------------------
# Prometheus
# ------------------------------------------------------------------------------
prometheus:
  prometheusSpec:
    retention: 7d
    storageSpec:
      emptyDir: {}
    resources:
      limits:
        memory: 1Gi
        cpu: 500m
      requests:
        memory: 512Mi
        cpu: 250m
    podMetadata:
      annotations:
        nexus.io/autonomy-level: "0"

# ------------------------------------------------------------------------------
# Alertmanager
# ------------------------------------------------------------------------------
alertmanager:
  alertmanagerSpec:
    resources:
      limits:
        memory: 256Mi
        cpu: 100m
      requests:
        memory: 128Mi
        cpu: 50m
    podMetadata:
      annotations:
        nexus.io/autonomy-level: "0"

# ------------------------------------------------------------------------------
# Grafana
# ------------------------------------------------------------------------------
grafana:
  podAnnotations:
    nexus.io/autonomy-level: "0"
  adminPassword: admin
  resources:
    limits:
      memory: 512Mi
      cpu: 200m
    requests:
      memory: 256Mi
      cpu: 100m
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL

# ------------------------------------------------------------------------------
# kube-state-metrics (subchart config key is "kube-state-metrics", not
# "kubeStateMetrics" which only holds the enabled toggle)
# ------------------------------------------------------------------------------
kube-state-metrics:
  podAnnotations:
    nexus.io/autonomy-level: "0"
  resources:
    limits:
      memory: 128Mi
      cpu: 100m
    requests:
      memory: 64Mi
      cpu: 50m

# ------------------------------------------------------------------------------
# node-exporter
# ------------------------------------------------------------------------------
prometheus-node-exporter:
  podAnnotations:
    nexus.io/autonomy-level: "0"
  # k3s/WSL2: host root is not a shared/slave mount, so HostToContainer
  # mountPropagation on "/" fails with CreateContainerError. Disable it.
  hostRootFsMount:
    enabled: false
  resources:
    limits:
      memory: 128Mi
      cpu: 100m
    requests:
      memory: 64Mi
      cpu: 50m
