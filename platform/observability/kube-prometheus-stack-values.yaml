# kube-prometheus-stack 86.2.2 values for the `observability` Application (ADR-016).
# The single values source: the Application references this file from Git; no inline values.

namespaceOverride: monitoring

# ------------------------------------------------------------------------------
# k3s: control-plane components are embedded, so their ServiceMonitors are off.
# coreDns monitoring would create a Service in kube-system, outside the AppProject.
# ------------------------------------------------------------------------------
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
kubeApiServer:
  enabled: false
coreDns:
  enabled: false

# ------------------------------------------------------------------------------
# Prometheus Operator
# ------------------------------------------------------------------------------
prometheusOperator:
  resources:
    limits:
      memory: 256Mi
      cpu: 200m
    requests:
      memory: 128Mi
      cpu: 100m

# ------------------------------------------------------------------------------
# Prometheus: 15 days on a local-path volume. An emptyDir lost the whole history on
# every WSL restart, and the M1 Locust baseline and Z-score windows depend on it.
# ------------------------------------------------------------------------------
prometheus:
  prometheusSpec:
    retention: 15d
    retentionSize: 9GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
    resources:
      limits:
        memory: 1Gi
        cpu: 500m
      requests:
        memory: 512Mi
        cpu: 250m

# ------------------------------------------------------------------------------
# Alertmanager
# ------------------------------------------------------------------------------
alertmanager:
  # G6 (spec §3): "Alertmanager groups by nexus_target". There is no NEXUS receiver: the operator
  # polls the v2 API for active alerts, so the receiver stays "null". `config` replaces the chart's
  # default wholesale, so the rest is that default, copied from kube-prometheus-stack 86.2.2
  # (values.yaml, alertmanager.config). The only addition is the second route: every alert that
  # carries nexus_target is grouped by it, and any other alert keeps the chart's group_by.
  config:
    global:
      resolve_timeout: 5m
    inhibit_rules:
      - source_matchers:
          - 'severity = critical'
        target_matchers:
          - 'severity =~ warning|info'
        equal:
          - 'namespace'
          - 'alertname'
      - source_matchers:
          - 'severity = warning'
        target_matchers:
          - 'severity = info'
        equal:
          - 'namespace'
          - 'alertname'
      - source_matchers:
          - 'alertname = InfoInhibitor'
        target_matchers:
          - 'severity = info'
        equal:
          - 'namespace'
      - target_matchers:
          - 'alertname = InfoInhibitor'
    route:
      group_by: ['namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'null'
      routes:
        - receiver: 'null'
          matchers:
            - alertname = "Watchdog"
        - receiver: 'null'
          matchers:
            - nexus_target =~ ".+"
          group_by: ['nexus_target']
    receivers:
      - name: 'null'
    templates:
      - '/etc/alertmanager/config/*.tmpl'
  alertmanagerSpec:
    resources:
      limits:
        memory: 256Mi
        cpu: 100m
      requests:
        memory: 128Mi
        cpu: 50m

# ------------------------------------------------------------------------------
# Grafana: the admin credentials come from the Secret monitoring/grafana-admin, created by
# bootstrap.sh from ~/.nexus/keys.env, never from Git (ADR-010, ADR-016). Datasources are the
# chart's own: Prometheus (the only default) and Alertmanager. Loki is REMOVED (spec §23).
# ------------------------------------------------------------------------------
grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  # The Flight Recorder datasource password (ADR-031): the Secret monitoring/flight-recorder-reader
  # is made by scripts/flight-recorder-secrets.sh. optional: Grafana still starts without it; only
  # that datasource then fails to authenticate.
  envValueFrom:
    FR_READER_PASSWORD:
      secretKeyRef:
        name: flight-recorder-reader
        key: password
        optional: true
  # M1b-3 (ADR-016 addendum). Basis, M1-5 run 1 (2026-09-27): with one dashboard open, the
  # container was throttled in 99 % of CFS periods at the 200m limit, the working set grew
  # 270 -> 483 MiB of 512 MiB, the readiness probe (chart default: no timeout, so 1 s) failed 123
  # times, and liveness killed it once.
  resources:
    limits:
      memory: 1Gi
      cpu: 1000m
    requests:
      memory: 256Mi
      cpu: 200m
  # Only timeoutSeconds is set; the chart keeps httpGet /api/health on port grafana. Liveness
  # stays at the chart default (timeout 30 s, failureThreshold 10, initialDelay 60 s).
  readinessProbe:
    timeoutSeconds: 5
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL

# ------------------------------------------------------------------------------
# kube-state-metrics: its subchart key is "kube-state-metrics"; "kubeStateMetrics" holds only
# the enabled toggle.
# ------------------------------------------------------------------------------
kube-state-metrics:
  resources:
    limits:
      memory: 128Mi
      cpu: 100m
    requests:
      memory: 64Mi
      cpu: 50m

# ------------------------------------------------------------------------------
# node-exporter. On k3s/WSL2 the host root is not a shared or slave mount, so HostToContainer
# mountPropagation on "/" fails with CreateContainerError. It is disabled.
# ------------------------------------------------------------------------------
prometheus-node-exporter:
  hostRootFsMount:
    enabled: false
  resources:
    limits:
      memory: 128Mi
      cpu: 100m
    requests:
      memory: 64Mi
      cpu: 50m
