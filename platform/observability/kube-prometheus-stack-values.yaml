# kube-prometheus-stack 86.2.2 values for the `observability` Application (ADR-016).
# The single values source: the Application references this file from Git; no inline values.

namespaceOverride: monitoring

# ------------------------------------------------------------------------------
# k3s: control-plane components are embedded, so their ServiceMonitors are off.
# coreDns monitoring would create a Service in kube-system, outside the AppProject.
# ------------------------------------------------------------------------------
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
kubeApiServer:
  enabled: false
coreDns:
  enabled: false

# ------------------------------------------------------------------------------
# Prometheus Operator
# ------------------------------------------------------------------------------
prometheusOperator:
  resources:
    limits:
      memory: 256Mi
      cpu: 200m
    requests:
      memory: 128Mi
      cpu: 100m

# ------------------------------------------------------------------------------
# Prometheus: 15 days on a local-path volume. An emptyDir lost the whole history on
# every WSL restart, and the M1 Locust baseline and Z-score windows depend on it.
# ------------------------------------------------------------------------------
prometheus:
  prometheusSpec:
    retention: 15d
    retentionSize: 9GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
    resources:
      limits:
        memory: 1Gi
        cpu: 500m
      requests:
        memory: 512Mi
        cpu: 250m

# ------------------------------------------------------------------------------
# Alertmanager
# ------------------------------------------------------------------------------
alertmanager:
  alertmanagerSpec:
    resources:
      limits:
        memory: 256Mi
        cpu: 100m
      requests:
        memory: 128Mi
        cpu: 50m

# ------------------------------------------------------------------------------
# Grafana: the admin credentials come from the Secret monitoring/grafana-admin, created by
# bootstrap.sh from ~/.nexus/keys.env, never from Git (ADR-010, ADR-016). Datasources are the
# chart's own: Prometheus (the only default) and Alertmanager. Loki is REMOVED (spec §23).
# ------------------------------------------------------------------------------
grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  resources:
    limits:
      memory: 512Mi
      cpu: 200m
    requests:
      memory: 256Mi
      cpu: 100m
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL

# ------------------------------------------------------------------------------
# kube-state-metrics: its subchart key is "kube-state-metrics"; "kubeStateMetrics" holds only
# the enabled toggle.
# ------------------------------------------------------------------------------
kube-state-metrics:
  resources:
    limits:
      memory: 128Mi
      cpu: 100m
    requests:
      memory: 64Mi
      cpu: 50m

# ------------------------------------------------------------------------------
# node-exporter. On k3s/WSL2 the host root is not a shared or slave mount, so HostToContainer
# mountPropagation on "/" fails with CreateContainerError. It is disabled.
# ------------------------------------------------------------------------------
prometheus-node-exporter:
  hostRootFsMount:
    enabled: false
  resources:
    limits:
      memory: 128Mi
      cpu: 100m
    requests:
      memory: 64Mi
      cpu: 50m
