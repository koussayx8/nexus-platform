apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-api-dev
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: nexus-platform
    app.kubernetes.io/component: application
  annotations:
    nexus.io/adr: "ADR-013, ADR-017, ADR-018"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: nexus
  source:
    repoURL: https://github.com/koussayx8/nexus-platform.git
    targetRevision: experiment/dev-state     # the runner's injection and reset surface (ADR-013)
    path: overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: nexus-dev
  # Replicas are delegated runtime state: NEXUS may scale; Git stays the baseline (spec §13).
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: sample-api
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
    retry:
      limit: 10
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }
