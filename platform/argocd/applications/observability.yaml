apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: nexus-platform
    app.kubernetes.io/component: observability
  annotations:
    nexus.io/adr: "ADR-007, ADR-016"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: nexus
  sources:
    # 1. The chart, with the values file from Git. No inline values (ADR-016).
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 86.2.2
      helm:
        releaseName: observability
        valueFiles:
          - $values/platform/observability/kube-prometheus-stack-values.yaml
    # 2. This repository as the source of $values.
    - repoURL: https://github.com/koussayx8/nexus-platform.git
      targetRevision: main
      ref: values
    # 3. NEXUS monitoring content: ServiceMonitor, alert rules, dashboard.
    - repoURL: https://github.com/koussayx8/nexus-platform.git
      targetRevision: main
      path: platform/observability/config
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true   # source 3's ServiceMonitor/PrometheusRule need source 1's CRDs
    retry:
      limit: 10
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }
