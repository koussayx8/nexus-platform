apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: nexus-platform
  annotations:
    nexus.io/adr: "ADR-015"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: nexus
  sources:
    - repoURL: https://kyverno.github.io/kyverno/
      chart: kyverno
      targetRevision: 3.8.0          # Kyverno v1.18.0, the version running before M0
      helm:
        releaseName: kyverno
        valueFiles:
          - $values/platform/kyverno/values.yaml
    - repoURL: https://github.com/koussayx8/nexus-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true         # Kyverno CRDs exceed the client-side apply annotation limit
    retry:
      limit: 10
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }
