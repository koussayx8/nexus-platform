apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: nexus
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: nexus-platform
  annotations:
    nexus.io/adr: "ADR-004, ADR-014"
spec:
  description: NEXUS platform applications — scoped to this cluster and the spec §3 namespaces

  sourceRepos:
    - https://github.com/koussayx8/nexus-platform.git
    - https://prometheus-community.github.io/helm-charts
    - https://kyverno.github.io/kyverno/

  # Spec §3 namespaces. nexus-apps is removed together with the old sample-api Application.
  destinations:
    - { server: https://kubernetes.default.svc, namespace: argocd }
    - { server: https://kubernetes.default.svc, namespace: kyverno }
    - { server: https://kubernetes.default.svc, namespace: monitoring }
    - { server: https://kubernetes.default.svc, namespace: nexus-system }
    - { server: https://kubernetes.default.svc, namespace: nexus-reasoner }
    - { server: https://kubernetes.default.svc, namespace: nexus-dev }
    - { server: https://kubernetes.default.svc, namespace: nexus-prod }
    - { server: https://kubernetes.default.svc, namespace: nexus-data }
    - { server: https://kubernetes.default.svc, namespace: nexus-load }
    - { server: https://kubernetes.default.svc, namespace: nexus-apps }

  clusterResourceWhitelist:
    - { group: "", kind: Namespace }
    - { group: apiextensions.k8s.io, kind: CustomResourceDefinition }
    - { group: rbac.authorization.k8s.io, kind: ClusterRole }
    - { group: rbac.authorization.k8s.io, kind: ClusterRoleBinding }
    - { group: admissionregistration.k8s.io, kind: MutatingWebhookConfiguration }
    - { group: admissionregistration.k8s.io, kind: ValidatingWebhookConfiguration }

  namespaceResourceWhitelist:
    - { group: "", kind: ConfigMap }
    - { group: "", kind: Secret }
    - { group: "", kind: Service }
    - { group: "", kind: ServiceAccount }
    - { group: apps, kind: Deployment }
    - { group: apps, kind: StatefulSet }
    - { group: apps, kind: DaemonSet }
    - { group: batch, kind: Job }
    - { group: rbac.authorization.k8s.io, kind: Role }
    - { group: rbac.authorization.k8s.io, kind: RoleBinding }
    - { group: monitoring.coreos.com, kind: Alertmanager }
    - { group: monitoring.coreos.com, kind: Prometheus }
    - { group: monitoring.coreos.com, kind: PrometheusRule }
    - { group: monitoring.coreos.com, kind: ServiceMonitor }
    - { group: argoproj.io, kind: Application }   # root Application
    - { group: argoproj.io, kind: AppProject }    # platform Application

  orphanedResources:
    warn: true
