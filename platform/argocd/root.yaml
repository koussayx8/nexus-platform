# Root Application: owns every Application in platform/argocd/applications/ (app of apps).
# Applied ONLY by bootstrap.sh on a freshly built cluster, after the AppProject (ADR-014).
# Never apply it to the pre-M0 cluster: its first sync would prune and cascade.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: nexus-platform
  annotations:
    nexus.io/adr: "ADR-014"
    # kyverno's chart has two helm.sh/hook: pre-delete Jobs; ArgoCD's app controller
    # unconditionally sets pre-delete-finalizer.argocd.argoproj.io (+/cleanup) on the kyverno
    # Application object on every reconciliation where it detects them, regardless of diff
    # strategy (controller/appcontroller.go, v3.3.8) -- root's own comparison of that Application
    # object never declares those finalizers, so without this it's a permanent, not transient,
    # OutOfSync. See the ADR-014 addendum (2026-09-26).
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: nexus
  source:
    repoURL: https://github.com/koussayx8/nexus-platform.git
    targetRevision: main
    path: platform/argocd/applications
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }
