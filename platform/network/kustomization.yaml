# NetworkPolicies N1-N6 (spec §18, ADR-033). Default-deny in every NEXUS namespace, then the
# allowed connections. Enforced by k3s' embedded network-policy controller; whether it enforces
# under WSL2 is verified by scripts/tests/network-n1-n6.sh (live check pending), not assumed.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - data.yaml
  - dev.yaml
  - load.yaml
  - prod.yaml
  - reasoner.yaml
  - system.yaml
