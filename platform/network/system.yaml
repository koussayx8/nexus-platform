# NetworkPolicies for nexus-system (spec §18, ADR-031). Operator and Flight Recorder DB.
# Labels: nexus-operator (operator/k8s), flight-recorder-db (task 1 manifests, assumed).
---
# Starting point for every NEXUS namespace: nothing in, nothing out until a policy below allows it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: nexus-system
  labels:
    app.kubernetes.io/part-of: nexus-platform
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# Prometheus scrapes the operator's HTTP port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: operator-ingress
  namespace: nexus-system
  labels:
    app.kubernetes.io/part-of: nexus-platform
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: nexus-operator}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
          podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
      ports:
        - {protocol: TCP, port: 8080}
---
# The API server (service IP 443, node 6443), Prometheus 9090, Alertmanager 9093, the Reasoner 8080,
# the Flight Recorder DB 5432 and DNS. The 6443 rule allows any non-cluster address: the node IP is not
# hardcoded (WSL2 changes it). The spec's public-443 egress is for the SHOULD fork-PR feature and is omitted.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: operator-egress
  namespace: nexus-system
  labels:
    app.kubernetes.io/part-of: nexus-platform
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: nexus-operator}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - ipBlock: {cidr: 10.43.0.1/32}
      ports:
        - {protocol: TCP, port: 443}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [10.42.0.0/16, 10.43.0.0/16]
      ports:
        - {protocol: TCP, port: 6443}
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
          podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
      ports:
        - {protocol: TCP, port: 9090}
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
          podSelector: {matchLabels: {app.kubernetes.io/name: alertmanager}}
      ports:
        - {protocol: TCP, port: 9093}
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: nexus-reasoner}}
          podSelector: {matchLabels: {app.kubernetes.io/name: nexus-reasoner}}
      ports:
        - {protocol: TCP, port: 8080}
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: flight-recorder-db}}
      ports:
        - {protocol: TCP, port: 5432}
---
# The Flight Recorder DB accepts the operator and Grafana on 5432 and has no egress (default-deny). nexusctl uses a port-forward.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flight-recorder-db-ingress
  namespace: nexus-system
  labels:
    app.kubernetes.io/part-of: nexus-platform
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: flight-recorder-db}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: nexus-operator}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
          podSelector: {matchLabels: {app.kubernetes.io/name: grafana}}
      ports:
        - {protocol: TCP, port: 5432}
