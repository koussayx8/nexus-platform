# NEXUS namespaces declared on main (spec §3, §12). nexus-dev is not here: sample-api-dev owns
# it on experiment/dev-state (overlays/dev), so a level change there is a commit on that branch.
# nexus.io/autonomy-level is the only autonomy control; a missing label means L0 (fail closed).
apiVersion: v1
kind: Namespace
metadata:
  name: nexus-system
  labels:
    app.kubernetes.io/part-of: nexus-platform
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: nexus-reasoner
  labels:
    app.kubernetes.io/part-of: nexus-platform
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: nexus-prod
  labels:
    app.kubernetes.io/part-of: nexus-platform
    nexus.io/autonomy-level: "1"          # L1 Recommend, held for the demo (§12)
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: nexus-data
  labels:
    app.kubernetes.io/part-of: nexus-platform
    nexus.io/autonomy-level: "0"          # L0 Observe (§12)
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: nexus-load
  labels:
    app.kubernetes.io/part-of: nexus-platform
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
