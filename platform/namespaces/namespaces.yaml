# NEXUS namespaces declared on main (spec §3, §12). nexus-dev is not here: sample-api-dev owns
# it on experiment/dev-state (overlays/dev), so a level change there is a commit on that branch.
# nexus.io/autonomy-level is the only autonomy control; a missing label means L0 (fail closed).
apiVersion: v1
kind: Namespace
metadata:
  name: nexus-system
  labels:
    app.kubernetes.io/part-of: nexus-platform
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: nexus-reasoner
  labels:
    app.kubernetes.io/part-of: nexus-platform
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: nexus-prod
  labels:
    app.kubernetes.io/part-of: nexus-platform
    nexus.io/autonomy-level: "1"          # L1 Recommend, held for the demo (§12)
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: nexus-data
  labels:
    app.kubernetes.io/part-of: nexus-platform
    nexus.io/autonomy-level: "0"          # L0 Observe (§12)
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: nexus-load
  labels:
    app.kubernetes.io/part-of: nexus-platform
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
# The Telegram bot's own namespace (ADR-040 decisions 1 and 6; B1: the tenth namespace). The
# approver credential (this namespace's ServiceAccount token) is never mounted in nexus-system.
# Declared here, not in bot/k8s, so the bot's NetworkPolicies and the Secret script find it before
# the nexus-bot Application syncs. No autonomy level: nothing is remediated in it.
apiVersion: v1
kind: Namespace
metadata:
  name: nexus-bot
  labels:
    app.kubernetes.io/part-of: nexus-platform
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
