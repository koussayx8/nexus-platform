# sample-api for nexus-prod, held at L1 for the demo. The namespace and its level come from the
# platform Application on main (platform/namespaces/).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nexus-prod

resources:
  - ../../apps/sample-api/k8s/base

# Signed image from green main run 37753756266 at 63c1831 (sample-api 0.3.1: latency buckets no
# wider than epsilon at 10-50 ms, ADR-022 addendum), cosign-verified 2026-10-08 against
# ci.yml@refs/heads/main, Rekor index 3144973728 (ADR-017, ADR-022).
# A digest bump is a commit.
images:
  - name: ghcr.io/koussayx8/nexus-platform/sample-api
    digest: sha256:3321d6faaeda4a8c11c0d17bfced448fae2c38f39fd7aafd77bbb3791201f268

# The DB role for this environment (ADR-020, change 3); the rest of the DB env is in the base.
patches:
  - target:
      kind: Deployment
      name: sample-api
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: sample-api
      spec:
        template:
          spec:
            containers:
              - name: sample-api
                env:
                  - name: DB_USER
                    value: app_prod
                  # Fault hooks on (spec §3: set in Git for nexus-dev and nexus-prod; ADR-022).
                  - name: NEXUS_FAULTS_ENABLED
                    value: "true"
