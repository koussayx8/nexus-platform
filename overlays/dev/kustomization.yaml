# sample-api for nexus-dev, the experiment target. Tracked on experiment/dev-state (ADR-013).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nexus-dev

resources:
  - namespace.yaml
  - ../../apps/sample-api/k8s/base

# Signed image from green main run 36759413828 at 3a09737 (sample-api 0.3.0), cosign-verified at
# M1b gate 1, Rekor index 3023614646 (ADR-017, ADR-022).
# A digest bump is a commit.
images:
  - name: ghcr.io/koussayx8/nexus-platform/sample-api
    digest: sha256:90fa807b711322dd54414c17bb3dd4b4a050cb43220b1e3874949829eff5827c

# The DB role for this environment (ADR-020, change 3); the rest of the DB env is in the base.
patches:
  - target:
      kind: Deployment
      name: sample-api
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: sample-api
      spec:
        template:
          spec:
            containers:
              - name: sample-api
                env:
                  - name: DB_USER
                    value: app_dev
                  # Fault hooks on (spec §3: set in Git for nexus-dev and nexus-prod; ADR-022).
                  - name: NEXUS_FAULTS_ENABLED
                    value: "true"
