[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-client"
version = "0.1.0"
description = "Typed Incident model, approval pinning and Kubernetes access shared by nexusctl (spec §16A)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.14,<3", "kubernetes>=37,<38"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["kubernetes", "kubernetes.*"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["nexus_client"]

[tool.setuptools.package-data]
nexus_client = ["py.typed"]
