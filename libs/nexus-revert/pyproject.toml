[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-revert"
version = "0.1.0"
description = "C8 (ADR-041): a ready revert pull request from a machine-account fork; NEXUS never merges"
requires-python = ">=3.12"
# nexusctl for its `sanitize` (one renderer, ADR-040 decision 11); GitHub is reached with the
# standard library, and git is the system binary.
dependencies = ["nexusctl", "pyyaml>=6,<7"]

[project.scripts]
nexus-revert = "nexus_revert.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nexus_revert*"]

[tool.setuptools.package-data]
nexus_revert = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["nexus_revert"]
known-third-party = ["nexusctl"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["yaml", "kubernetes", "kubernetes.*", "nexusctl", "nexusctl.*"]
ignore_missing_imports = true
