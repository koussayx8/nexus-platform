apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-api
  labels:
    app.kubernetes.io/name: sample-api
    app.kubernetes.io/part-of: nexus-platform
    app.kubernetes.io/component: api
    app.kubernetes.io/version: "0.3.1"
  annotations:
    nexus.io/owner: koussay
spec:
  replicas: 2
  # Explicit rollout (ADR-022): one extra pod at a time, never fewer available pods than
  # replicas. At the 5-replica bound (C4, K2) that is at most 6 pods per namespace.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: sample-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sample-api
        app.kubernetes.io/part-of: nexus-platform
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sample-api
          image: ghcr.io/koussayx8/nexus-platform/sample-api   # digest pinned in overlays/{dev,prod}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          # Dependency DB for /items (ADR-020, change 2). DB_USER is set per overlay (app_dev,
          # app_prod); each namespace has its own dependency-db-app Secret.
          env:
            - name: DB_HOST
              value: dependency-db.nexus-data
            - name: DB_NAME
              value: nexus
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dependency-db-app
                  key: password
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 10
