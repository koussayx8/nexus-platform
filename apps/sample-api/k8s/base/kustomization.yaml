# sample-api base, shared by overlays/dev (nexus-dev) and overlays/prod (nexus-prod).
# No namespace and no image digest here: the overlays set both (spec §19, ADR-017).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize

resources:
  - deployment.yaml
  - service.yaml
