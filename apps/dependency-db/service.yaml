# Headless Service for the StatefulSet's pod identity, and the ClusterIP Service clients use
# (dependency-db.nexus-data:5432).
apiVersion: v1
kind: Service
metadata:
  name: dependency-db-headless
  labels:
    app.kubernetes.io/name: dependency-db
    app.kubernetes.io/part-of: nexus-platform
    app.kubernetes.io/component: database
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: dependency-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: dependency-db
  labels:
    app.kubernetes.io/name: dependency-db
    app.kubernetes.io/part-of: nexus-platform
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dependency-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
