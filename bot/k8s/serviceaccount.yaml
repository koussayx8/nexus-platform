# The bot's identity. Bound by platform/rbac/nexus-bot/ to read-only Roles and to impersonation of
# exactly koussay-approver / nexus-approvers (ADR-040 decisions 4 and 5).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nexus-bot
  namespace: nexus-bot
  labels:
    app.kubernetes.io/name: nexus-bot
    app.kubernetes.io/part-of: nexus-platform
