# The bot's configuration (bot/README.md "Configuration"). The allowlist is the list of who may
# approve through the chat: one numeric Telegram user ID per approver username, reviewed in Git.
# One entry: the owner's Telegram user ID (given by the owner on 2026-11-21; the bot is
# @nexus_pfe_bot), mapped to koussay-approver, the one user the bot may impersonate
# (platform/rbac/nexus-bot/). A second entry is a second approver.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nexus-bot-config
  namespace: nexus-bot
  labels:
    app.kubernetes.io/name: nexus-bot
    app.kubernetes.io/part-of: nexus-platform
data:
  config.yaml: |
    allowlist:
      "8998653791": koussay-approver
    approverGroup: nexus-approvers
    namespaces: [nexus-dev, nexus-prod]
    pollSeconds: 10
    catchUpMinutes: 15
