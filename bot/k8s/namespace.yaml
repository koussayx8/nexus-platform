# The bot's own namespace (ADR-040 decisions 1 and 6; B1: a tenth namespace). The approver
# credential (this namespace's ServiceAccount token) is never mounted in nexus-system.
apiVersion: v1
kind: Namespace
metadata:
  name: nexus-bot
  labels:
    app.kubernetes.io/part-of: nexus-platform
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
